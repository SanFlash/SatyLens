<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; cursor: crosshair; overflow: hidden; }
  #root { position: fixed; inset: 0; background: rgba(4, 8, 20, 0.35); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .selection-box { position: absolute; border: 2px solid #3b82f6; background: rgba(59,130,246,0.15); box-shadow: 0 0 0 4000px rgba(4,8,20,0.45); display: none; }
  .dims-label { position: absolute; top: -26px; left: 0; background: #3b82f6; color: #fff; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
  .toolbar {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: #0b1220; border: 1px solid #1f2a44; color: #e8ecf6;
    padding: 8px 14px; border-radius: 10px; font-size: 13px;
    display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .toolbar button { font-family: inherit; font-size: 12px; font-weight: 600; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  .btn-cancel { background: #1f2a44; color: #e8ecf6; }
  .btn-capture { background: #3b82f6; color: #fff; }
  .btn-capture:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
  <div id="root">
    <div id="box" class="selection-box"><div id="dimsLabel" class="dims-label"></div></div>
    <div class="toolbar">
      <span>Drag to select an area · Esc to cancel</span>
      <button id="cancelBtn" class="btn-cancel" type="button">Cancel</button>
      <button id="captureBtn" class="btn-capture" type="button" disabled>Capture</button>
    </div>
  </div>
  <script src="selector.js"></script>
</body>
</html>
